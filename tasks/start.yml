---
###############################################################################
# Start
###############################################################################
# Start services and confirm they are active and running.

- name: 'Start | systemd | nginx'
  ansible.builtin.systemd:
    name: 'nginx.service'
    state: '{{ "started" if nginx__srv._restart else "reloaded" }}'
    enabled: true
    daemon_reload: true
  delay: 15
  retries: 3
  register: nginx__service
  until: nginx__service.status.ActiveState == 'active'

- name: 'Start | fact | query services'
  ansible.builtin.service_facts:

- name: 'Start | assert | services running'
  ansible.builtin.assert:
    quiet: true
    that: ansible_facts.services[item].state == 'running'
    fail_msg: |

      ✘ Service failed to start.
      {{ item }}
  loop:
    - 'nginx.service'
