---
# yamllint disable rule:line-length
###############################################################################
# Annotate User Configuration.
###############################################################################
# Sanitize (standardize with default values if not set) NGINX configuration.
#
# Use r_pufky.data.v3 data annotations to enforce consistency and validation
# checks.
#
# Generates:
#   _nginx_ngx_map: list of dict - Annotated config map.
#
# Reference:
# * https://docs.ansible.com/ansible/latest/dev_guide/developing_program_flow_modules.html#argument-spec
# * https://github.com/ansible/ansible/issues/77159
# yamllint enable rule:line-length

- name: 'Annotate | sanitize & annotate service defaults'
  ansible.builtin.set_fact:  # noqa jinja[spacing] readability.
    _nginx_srv_packages: "{{ {} | r_pufky.data.v3(
        raw=nginx_srv_packages,
        default=[],
        hint='list of str',
        order=1
        )
      }}"
    _nginx_srv_restart_enable: "{{ {} | r_pufky.data.v3(
        raw=nginx_srv_restart_enable,
        default=false,
        hint='bool',
        order=2
        )
      }}"
    _nginx_srv_user: "{{ {} | r_pufky.data.v3(
        raw=nginx_srv_user,
        default='nginx',
        _uid='',
        hint='str',
        added='6.4.0',
        order=3
        )
      }}"
    _nginx_srv_group: "{{ {} | r_pufky.data.v3(
        raw=nginx_srv_group,
        default='nginx',
        _gid='',
        hint='str',
        added='6.4.0',
        order=4
        )
      }}"
    _nginx_srv_create_user: "{{ {} | r_pufky.data.v3(
        raw=nginx_srv_create_user,
        default=true,
        hint='bool',
        added='6.4.0',
        order=5
        )
      }}"

- name: 'Annotate | sanitize & annotate config defaults'
  ansible.builtin.set_fact:  # noqa jinja[spacing] readability.
    _nginx_cfg_basic_auth_enable: "{{ {} | r_pufky.data.v3(
        raw=nginx_cfg_basic_auth_enable,
        default=false,
        _dest=nginx_role_root ~ '/auth/',
        hint='bool',
        order=1
        )
      }}"
    _nginx_cfg_basic_auth_users: "{{ {} | r_pufky.data.v3(
        raw=nginx_cfg_basic_auth_users,
        data=[],
        default=[],
        _dest=nginx_role_root ~ '/auth/users',
        hint='list of str',
        sensitive=true,
        order=2
        )
      }}"
    _nginx_cfg_ca_dir: "{{ {} | r_pufky.data.v3(
        raw=nginx_cfg_ca_dir,
        default='',
        _src=nginx_cfg_ca_dir | regex_replace('\\/$', '') ~ '/',
        _dest=nginx_role_root ~ '/ca',
        hint='str',
        order=3
        )
      }}"
    _nginx_cfg_confd_dir: "{{ {} | r_pufky.data.v3(
        raw=nginx_cfg_confd_dir,
        default='files/etc/conf.d',
        _src=nginx_cfg_confd_dir | regex_replace('\\/$', '') ~ '/',
        _dest=nginx_role_root ~ '/conf.d',
        hint='str',
        order=4
        )
      }}"
    _nginx_cfg_fastcgi_params_file: "{{ {} | r_pufky.data.v3(
        raw=nginx_cfg_fastcgi_params_file,
        default='files/etc/fastcgi_params',
        _src=nginx_cfg_fastcgi_params_file | regex_replace('\\/$', ''),
        _dest=nginx_role_root ~ '/fastcgi_params',
        hint='str',
        order=5
        )
      }}"
    _nginx_cfg_scgi_params_file: "{{ {} | r_pufky.data.v3(
        raw=nginx_cfg_scgi_params_file,
        default='files/etc/scgi_params',
        _src=nginx_cfg_scgi_params_file | regex_replace('\\/$', ''),
        _dest=nginx_role_root ~ '/scgi_params',
        hint='str',
        order=6
        )
      }}"
    _nginx_cfg_uwsgi_params_file: "{{ {} | r_pufky.data.v3(
        raw=nginx_cfg_uwsgi_params_file,
        default='files/etc/uwsgi_params',
        _src=nginx_cfg_uwsgi_params_file | regex_replace('\\/$', ''),
        _dest=nginx_role_root ~ '/uwsgi_params',
        hint='str',
        order=7
        )
      }}"
    _nginx_cfg_mime_types_file: "{{ {} | r_pufky.data.v3(
        raw=nginx_cfg_mime_types_file,
        default='files/etc/mime.types',
        _src=nginx_cfg_mime_types_file | regex_replace('\\/$', ''),
        _dest=nginx_role_root ~ '/mime.types',
        hint='str',
        order=8
        )
      }}"
    _nginx_cfg_nginx_conf_file: "{{ {} | r_pufky.data.v3(
        raw=nginx_cfg_nginx_conf_file,
        default='files/etc/nginx.conf',
        _src=nginx_cfg_nginx_conf_file | regex_replace('\\/$', ''),
        _dest=nginx_role_root ~ '/nginx.conf',
        hint='str',
        order=9
        )
      }}"
    _nginx_cfg_web_root_dir: "{{ {} | r_pufky.data.v3(
        raw=nginx_cfg_web_root_dir,
        default='files/web_root',
        _src=nginx_cfg_web_root_dir | regex_replace('\\/$', '') ~ '/',
        _dest=nginx_role_web_root,
        hint='str',
        order=10
        )
      }}"
    _nginx_cfg_streamd_dir: "{{ {} | r_pufky.data.v3(
        raw=nginx_cfg_streamd_dir,
        default='',
        _src=nginx_cfg_streamd_dir | regex_replace('\\/$', '') ~ '/',
        _dest=nginx_role_root ~ '/stream.d',
        hint='str',
        order=11
        )
      }}"

- name: 'Annotate | merge template nginx_cfg_basic_auth_users'
  ansible.builtin.set_fact:
    _nginx_cfg_basic_auth_users: '{{
        _nginx_cfg_basic_auth_users |
          combine({"data": _nginx_cfg_basic_auth_users.data | default([]) +
                [nginx_role_template_basic_auth | combine(item)]})
      }}'
  loop: '{{ _nginx_cfg_basic_auth_users.raw }}'
  loop_control:
    label: '{{ item.user }}'

- name: 'Annotate | generate config map'
  ansible.builtin.set_fact:
    _nginx_map: '{{
        hostvars[inventory_hostname] | dict2items |
        selectattr("key", "match", "_nginx_cfg_*")
      }}'
