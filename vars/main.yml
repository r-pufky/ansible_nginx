---
###############################################################################
# NGINX Role Options
###############################################################################
#
# Updates:
# * KEEP a separate change log as changes are made.
# * Use bare-metal docs to validate package/process changes.
# * Update defaults.
# * Update tests for any changes.
# * Standard validation testing (yamllint, ansible-lint, to-do, no-qa).
#
# Reference:
# * https://nginx.org/en/download.html

nginx___release: "{{ {} | r_pufky.data.v3(

    _date='2026-04-03',
    _debian='trixie',
    _app='1.28.0',
  ) }}"


###############################################################################
# APT Packages
###############################################################################

nginx___packages:
  - 'nginx'
  - 'ca-certificates'

nginx___apt_pins:
  - name: 'nginx'
    package: '*'
    pin: 'origin nginx.org, release o=nginx'
    pin_priority: 900
    state: 'present'

nginx___apt_nginx:
  - name: 'nginx'
    types:
      - 'deb'
    uris: 'http://nginx.org/packages/mainline/debian'
    suites:
      - 'trixie'
    components:
      - 'nginx'
    signed_by: 'https://nginx.org/keys/nginx_signing.key'

###############################################################################
# NGINX Options
###############################################################################

nginx___app: "{{ {} | r_pufky.data.v3(

    _version=nginx___release._app,
    _etc_d='/etc/nginx',
    _conf_d='/etc/nginx/conf.d',
    _secure_conf_d='/etc/nginx/secure.conf.d',

    _fastcgi_params='/etc/nginx/fastcgi_params',
    _mime_types='/etc/nginx/mime.types',
    _nginx_conf='/etc/nginx/nginx.conf',
    _scgi_params='/etc/nginx/scgi_params',
    _uwsgi_params='/etc/nginx/uwsgi_params',

    _web_d='/usr/share/nginx',

    _default='/etc/default/nginx',
    _default_debug='/etc/default/nginx-debug',
  ) }}"

###############################################################################
# Default NGINX User Group
###############################################################################

nginx___group:
  name: 'nginx'
  gid: 115

nginx___user:
  name: 'nginx'
  group: 'nginx'
  uid: 115
  shell: '/usr/sbin/nologin'
  home: '/nonexistent'
  comment: 'nginx user,,,'
  create_home: false
  password: '!'
  password_lock: true
  update_password: 'always'
  expires: -1
  system: true
