---
###############################################################################
# Feature Flags
###############################################################################

# 1. Install application?
#
# Creates required default directories, users, install packages, download
# software, autogenerates config if not specified, update and start services.
#
# Default: True.
nginx_flg_install: true

# 2. Set configuration data?
#
# Overwrite config and web root data sourced from maria_srv_*. Stops service,
# deploys user config data, updates and starts services.
#
# Default: False.
nginx_flg_config: false

###############################################################################
# Service
###############################################################################
# Does NOT automatically drop privileges to managed user.
#
# Requires adding the following lines to nginx.conf:
#
#   user <user> [group]
#
# Reference:
# * https://nginx.org/en/docs/ngx_core_module.html#user

# List of additional NGINX modules to install.
#
# All NGINX modules are installed using the NGINX repository. 'nginx' package
# always installed.
#
# Default: [].
#
# Reference:
# * https://nginx.org/en/linux_packages.html#Debian
nginx_srv_packages: []

# Enable restart instead of reload for NGINX service?
#
# Certain cases - such as listen directives for new IP's - require a full
# restart instead of reloading.
#
# Values:
#    True: NGINX service is stopped, changes applied, and restarted. Will cause
#          service interruptions.
#   False: NGINX service continues to run during role application, with reload
#          issued after changes are applied.
#
# Default: False (reload).
nginx_srv_restart: false

# User that NGINX will run under.
#
# 'nginx' will automatically be created using vars/main.yml if required.
# All other accounts are checked for existence.
#
# Default: 'nginx'.
nginx_srv_user: 'nginx'

# Group that NGINX will run under.
#
# 'nginx' will automatically be created using vars/main.yml if required.
# All other accounts are checked for existence.
#
# Default: 'nginx'.
nginx_srv_group: 'nginx'

# Service defaults.
#
# Ansible controller path to nginx (treated as a jinja2 template allowing for
# ansible variable use). Overwrites existing /etc/default/nginx.
#
# A default configuration is autogenerated if not provided (see
# templates/default).
#
# nginx_srv_default: 'host_vars/nginx.example.com/fastcgi_params'
#
# Default: '' (use minimally configured default).
nginx_srv_default: ''

# Service debug defaults.
#
# Ansible controller path to nginx-debug (treated as a jinja2 template allowing
# for ansible variable use). Overwrites existing
# /etc/default/nginx-debug.
#
# A default configuration is autogenerated if not provided (see
# templates/default).
#
# nginx_srv_default: 'host_vars/nginx.example.com/fastcgi_params'
#
# Default: '' (use minimally configured default).
nginx_srv_default_debug: ''

###############################################################################
# Config
###############################################################################

# NGINX /etc/nginx/conf.d to set.
#
# Ansible controller path to source directory (treated as a jinja2 templates
# allowing for ansible variable use).
#
# Sets /etc/nginx/conf.d/*. Files not sourced will be removed.
#
# nginx_flg_config=true:
# ⋮nginx_srv_conf_d='' - Remove existing files.
# ⋮nginx_srv_conf_d='{DIR}' - Replace existing files with sourced template
# ⋮    dir.
# nginx_flg_config=false:
# ⋮nginx_srv_conf_d='' - Use default postgres configuration template dir in
# ⋮    templates/default.
# ⋮nginx_srv_conf_d='{DIR}' - Take no action.
#
# Required default NGINX configuration is auto-generated if not set (see
# templates/default).
#
# nginx_cfg_conf_d: 'host_vars/nginx.example.com/conf.d'
#
# Default: '' (use minimally configured default).
nginx_cfg_conf_d: ''

# NGINX /etc/nginx/secure.conf.d to set.
#
# Ansible controller path to source directory (treated as a jinja2 templates
# allowing for ansible variable use).
#
# Sets /etc/nginx/secure.conf.d/* with 0750:0640 root:root permissions.
# Certificates, htpasswd files, etc. should be included here and sourced from
# standard conf.d and configuration files. Files not sourced will be removed.
#
# nginx_flg_config=true:
# ⋮nginx_cfg_secure_conf_d='' - Remove existing files.
# ⋮nginx_cfg_secure_conf_d='{DIR}' - Replace existing files with sourced
# ⋮    template dir.
# nginx_flg_config=false:
# ⋮nginx_cfg_secure_conf_d='' - Use default postgres configuration template
# ⋮    dir in templates/default.
# ⋮nginx_cfg_secure_conf_d='{DIR}' - Take no action.
#
# nginx_cfg_secure_conf_d: 'host_vars/nginx.example.com/secure.conf.d'
#
# Default: '' (use minimally configured default).
nginx_cfg_secure_conf_d: ''

# Fast CGI parameters configuration.
#
# Ansible controller path to fastcgi_params (treated as a jinja2 template
# allowing for ansible variable use).
#
# Sets /etc/nginx/fastcgi_params. A default configuration is autogenerated if
# not provided (see templates/default).
#
# nginx_cfg_fastcgi_params: 'host_vars/nginx.example.com/fastcgi_params'
#
# Default: '' (use minimally configured default).
nginx_cfg_fastcgi_params: ''

# MIME type configuration.
#
# Ansible controller path to mime.types (treated as a jinja2 template allowing
# for ansible variable use).
#
# Sets /etc/nginx/mime.types. A default configuration is autogenerated if not
# provided (see templates/default).
#
# nginx_cfg_mime_types: 'host_vars/nginx.example.com/mime.types'
#
# Default: '' (use minimally configured default).
nginx_cfg_mime_types: ''

# NGINX main configuration.
#
# Ansible controller path to nginx.conf (treated as a jinja2 template allowing
# for ansible variable use).
#
# Sets /etc/nginx/nginx.conf. A default configuration is autogenerated if not
# provided (see templates/default).
#
# nginx_cfg_nginx_conf: 'host_vars/nginx.example.com/nginx.conf'
#
# Default: '' (use minimally configured default).
nginx_cfg_nginx_conf: ''

# SCGI parameters configuration.
#
# Ansible controller path to scgi_params (treated as a jinja2 template allowing
# for ansible variable use).
#
# Sets /etc/nginx/scgi_params. A default configuration is autogenerated if not
# provided (see templates/default).
#
# nginx_cfg_scgi_params: 'host_vars/nginx.example.com/scgi_params'
#
# Default: '' (use minimally configured default).
nginx_cfg_scgi_params: ''

# UWSGI parameters configuration.
#
# Ansible controller path to uwsgi_params (treated as a jinja2 template
# allowing for ansible variable use).
#
# Sets /etc/nginx/uwsgi_params. A default configuration is autogenerated if not
# provided (see templates/default).
#
# nginx_cfg_uwsgi_params: 'host_vars/nginx.example.com/uwsgi_params'
#
# Default: '' (use minimally configured default).
nginx_cfg_uwsgi_params: ''

# Web root configuration.
#
# Ansible controller path to source directory (treated as a jinja2 templates
# allowing for ansible variable use).
#
# Sets /usr/share/nginx/* with 0755:0644 root:root permissions. Files not
# sourced will be removed.
#
# nginx_flg_config=true:
# ⋮nginx_cfg_web_d='' - Remove existing files.
# ⋮nginx_cfg_web_d='{DIR}' - Replace existing files with sourced template dir.
# nginx_flg_config=false:
# ⋮nginx_cfg_web_d='' - Use default postgres configuration template dir in
# ⋮    templates/default.
# ⋮nginx_cfg_web_d='{DIR}' - Take no action.
#
# A default configuration is autogenerated if not provided (see
# templates/default).
#
# nginx_cfg_web_d: 'host_vars/nginx.example.com/web.d'
#
# Default: '' (use minimally configured default).
nginx_cfg_web_d: ''
